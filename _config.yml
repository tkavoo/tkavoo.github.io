locale: "en-US"
title: "Thomas Kavoo"
name: "Thomas Kavoo"
description: "Earth system scientist studying terrestrial water and carbon cycles, land-surface models, and coastal wetland change."
url: "https://tkavoo.github.io"
baseurl: ""
repository: "tkavoo/tkavoo.github.io"
future: true

author:
  name: "Thomas Kavoo"
  email: "tmk0038@auburn.edu"

include:
  - _pages
  - files

exclude:
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - markdown_generator
  - node_modules
  - package.json
  - tmp
  - vendor
  - _extra_files

keep_files:
  - .git

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: default
